<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./angular.min.js"></script>
    <script src="./angular-route.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./node_modules/angular-ui-bootstrap/dist/ui-bootstrap-csp.css" />
    <script src="./node_modules/angular-ui-bootstrap/dist/ui-bootstrap.js"></script>
    <script src="./node_modules/angular-ui-bootstrap/dist/ui-bootstrap-tpls.js"></script>
    <script src="./dist/filters/capitalize.filter.js"></script>
    <script src="./dist/filters/search.filter.js"></script>
    <script src="./dist/shared/services/alert.service.js"></script>
    <script src="./dist/services/cart.service.js"></script>
    <script src="./dist/services/auth.service.js"></script>
    <script src="./dist/services/user.service.js"></script>
    <script src="./dist/services/catalog.service.js"></script>
    <script src="./dist/shared/controllers/alert.controller.js"></script>
    <script src="./dist/controllers/cart.controller.js"></script>
    <script src="./dist/controllers/login.controller.js"></script>
    <script src="./dist/controllers/catalog.controller.js"></script>
    <script src="./dist/controllers/main.controller.js"></script>
    <script src="./dist/shared/shared.module.js"></script>
    <script src="./dist/modules/cart.module.js"></script>
    <script src="./dist/modules/user.module.js"></script>
    <script src="./dist/modules/auth.module.js"></script>
    <script src="./dist/modules/catalog.module.js"></script>
    <script src="./dist/app.module.js"></script>
    <style>
      body {
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .login-container {
        width: 350px;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .alertPosition {
        width: 30%;
        left: 35vw;
      }

      .alertDiv {
        position: fixed;
        top: 2%;
        z-index: 1000;
        width: 100%;
      }
    </style>
  </head>
  <body ng-app="eCommerce">
    <nav
      class="navbar navbar-expand-lg bg-body-tertiary"
      ng-controller="MainController as mainCtrl"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <i class="bi bi-basket"></i>
          Basket.com
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <button
              ng-if="mainCtrl.isUserLoggedIn()"
              class="btn btn-danger ms-2"
              ng-click="mainCtrl.logout()"
            >
              Logout
            </button>
            <button
              ng-if="mainCtrl.showLoginBtn()"
              ng-click="mainCtrl.login()"
              class="btn btn-primary ms-2"
            >
              Login
            </button>
            <button class="ms-2 btn btn-primary" ng-click="mainCtrl.goToCart()">
              <i class="bi bi-bag"></i> Cart : {{ mainCtrl.cartItemsCount() }}
            </button>
          </ul>
        </div>
      </div>
    </nav>
    <div ng-controller="AlertController as alertCtrl" class="alertDiv">
      <div
        ng-repeat="alert in alertCtrl.getAvlAlerts()"
        ng-class="'alert alertPosition alert-' + (alert.type || 'warning')"
      >
        {{alert.message}}
      </div>
    </div>
    <div ng-view class="w-75 h-100 pt-4 m-auto"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
