<div ng-controller="CatalogController as catCtrl" class="w-100">
    <h3 class="text-center">Catalogs</h3>
    <div class="align-items-center d-flex flex-column w-100 mt-4">
        <div class="d-flex w-100">
            <div class="w-50">
                <input ng-disabled="catCtrl.catalogs.length == 0" type="text" class="form-control w-100" placeholder="Search Catalogs by Name" ng-model="catCtrl.searchText" />
            </div>
            <div class="align-items-center d-flex justify-content-end w-50">
                <label for="category">Category : </label>
                <select name="categories" name="category" class="form-control w-25 ms-2" ng-model="catCtrl.selectedCategory" ng-change="catCtrl.getCatalogsByCategory()">
                    <option value="All">All</option>
                    <option ng-repeat="category in catCtrl.categories" value="{{ category }}">{{ category | capitalize }}</option>
                </select>
            </div>
        </div>
    </div>
    <div class="w-100 d-flex flex-column gap-3 justify-content-center align-items-center mt-2">
        <p ng-if="catCtrl.catalogs.length == 0" class="mt-4">Loading ...</p>
        <div ng-repeat="catalog in catCtrl.catalogs | search:'title':catCtrl.searchText" class="card mb-3 w-100 d-flex flex-row align-items-center p-3">
            <img ng-src="{{ catalog.image }}" class="img-thumbnail me-3" style="width: 200px; height: auto;" alt="Product Image" />
            <div class="card-body">
                <h5 class="card-title">{{ catalog.title }}</h5>
                <p class="card-text">{{ catalog.description }}</p>
                <p class="card-text"><strong>Category:</strong> {{ catalog.category }}</p>
                <p class="card-text"><strong>Rating:</strong> {{ catalog.rating.rate }} / 5</p>
                <p class="card-text"><strong>Stock Available:</strong> {{ catalog.quantityAvl }}</p>
                <p class="card-text"><strong>Price:</strong> {{ catalog.price | currency:'INR ' : 2 }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <button class="btn btn-primary" 
                            ng-if="catalog.quantityAvl != 0"
                            ng-click="catCtrl.addToCart(catalog)">
                        Add to Cart
                    </button>
                    <button class="btn btn-primary" 
                            ng-if="catalog.quantityAvl == 0"
                            ng-disabled="true"
                            >
                        Item Out of Stock
                    </button>
                    <label class="text-primary" for="" ng-if="catalog.itemsInCart > 0">In Cart : {{ catalog.itemsInCart }}</label>
                </div>
            </div>
        </div>
    </div>
</div>
